services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
      NEXT_TELEMETRY_DISABLED: "${NEXT_TELEMETRY_DISABLED}"
      BACKEND_INTERNAL_URL: "${BACKEND_INTERNAL_URL}"
      APP_ORIGIN: "${APP_ORIGIN}"
      SURVEY_OAUTH_STATE_KEY: "${SURVEY_OAUTH_STATE_KEY}"
      SUPABASE_URL: "${SUPABASE_URL}"
      SUPABASE_PUBLISHABLE_KEY: "${SUPABASE_PUBLISHABLE_KEY}"
      CSV_EXPORT_ENABLED: "${CSV_EXPORT_ENABLED:-false}"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PROJECT_NAME: "${PROJECT_NAME}"
      PROJECT_VERSION: "${PROJECT_VERSION}"
      API_V1_PREFIX: "${API_V1_PREFIX}"
      DEBUG: "${DEBUG}"
      SQL_ECHO: "${SQL_ECHO}"
      LOG_JSON: "${LOG_JSON}"
      DB_MODE: "${DB_MODE}"
      DATABASE_TLS_MODE: "${DATABASE_TLS_MODE:-disable}"
      LOCAL_DATABASE_URL: "${LOCAL_DATABASE_URL}"
      SUPABASE_DATABASE_URL: "${SUPABASE_DATABASE_URL}"
      BACKEND_CORS_ORIGINS: "${BACKEND_CORS_ORIGINS}"
      SUPABASE_URL: "${SUPABASE_URL}"
      SUPABASE_PUBLISHABLE_KEY: "${SUPABASE_PUBLISHABLE_KEY}"
      SUPABASE_SECRET_KEY: "${SUPABASE_SECRET_KEY}"
      APP_ORIGIN: "${APP_ORIGIN}"
      GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID}"
      SURVEY_RESPONDENT_HMAC_SECRET: "${SURVEY_RESPONDENT_HMAC_SECRET:-}"
      SURVEY_GOOGLE_SESSION_MAX_AGE_SECONDS: "${SURVEY_GOOGLE_SESSION_MAX_AGE_SECONDS:-300}"
      INITIAL_ADMIN_EMAIL: "${INITIAL_ADMIN_EMAIL}"
      INITIAL_ADMIN_USERNAME: "${INITIAL_ADMIN_USERNAME}"
      INITIAL_ADMIN_FIRST_NAME: "${INITIAL_ADMIN_FIRST_NAME}"
      INITIAL_ADMIN_LAST_NAME: "${INITIAL_ADMIN_LAST_NAME}"
      SYSTEM_ACTOR_ID: "${SYSTEM_ACTOR_ID}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      UPSTASH_REDIS_REST_URL: "${UPSTASH_REDIS_REST_URL:-}"
      UPSTASH_REDIS_REST_TOKEN: "${UPSTASH_REDIS_REST_TOKEN:-}"
      REDIS_MAX_CONNECTIONS: "${REDIS_MAX_CONNECTIONS:-32}"
      REDIS_CONNECT_TIMEOUT_SECONDS: "${REDIS_CONNECT_TIMEOUT_SECONDS:-2}"
      REDIS_SOCKET_TIMEOUT_SECONDS: "${REDIS_SOCKET_TIMEOUT_SECONDS:-2}"
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-false}"
      RATE_LIMIT_INCLUDE_CLIENT_IP: "${RATE_LIMIT_INCLUDE_CLIENT_IP:-false}"
      RATE_LIMIT_READ_FAILURE_POLICY: "${RATE_LIMIT_READ_FAILURE_POLICY:-fail_closed}"
      RATE_LIMIT_KEY_HMAC_SECRET: "${RATE_LIMIT_KEY_HMAC_SECRET:-}"
      WITHDRAWAL_CODE_HMAC_SECRET: "${WITHDRAWAL_CODE_HMAC_SECRET:-}"
      CSV_EXPORT_ENABLED: "${CSV_EXPORT_ENABLED:-false}"
      PUBLIC_SURVEY_READ_LIMIT: "${PUBLIC_SURVEY_READ_LIMIT:-60}"
      PUBLIC_SURVEY_READ_WINDOW_SECONDS: "${PUBLIC_SURVEY_READ_WINDOW_SECONDS:-60}"
      PUBLIC_SURVEY_READ_GLOBAL_LIMIT: "${PUBLIC_SURVEY_READ_GLOBAL_LIMIT:-6000}"
      PUBLIC_SURVEY_READ_GLOBAL_WINDOW_SECONDS: "${PUBLIC_SURVEY_READ_GLOBAL_WINDOW_SECONDS:-60}"
      PUBLIC_SURVEY_SUBMIT_LIMIT: "${PUBLIC_SURVEY_SUBMIT_LIMIT:-10}"
      PUBLIC_SURVEY_SUBMIT_WINDOW_SECONDS: "${PUBLIC_SURVEY_SUBMIT_WINDOW_SECONDS:-60}"
      PUBLIC_SURVEY_SUBMIT_GLOBAL_LIMIT: "${PUBLIC_SURVEY_SUBMIT_GLOBAL_LIMIT:-1000}"
      PUBLIC_SURVEY_SUBMIT_GLOBAL_WINDOW_SECONDS: "${PUBLIC_SURVEY_SUBMIT_GLOBAL_WINDOW_SECONDS:-60}"
      PUBLIC_SURVEY_WITHDRAWAL_CLIENT_LIMIT: "${PUBLIC_SURVEY_WITHDRAWAL_CLIENT_LIMIT:-10}"
      PUBLIC_SURVEY_WITHDRAWAL_CLIENT_WINDOW_SECONDS: "${PUBLIC_SURVEY_WITHDRAWAL_CLIENT_WINDOW_SECONDS:-60}"
      PUBLIC_SURVEY_WITHDRAWAL_GLOBAL_LIMIT: "${PUBLIC_SURVEY_WITHDRAWAL_GLOBAL_LIMIT:-1000}"
      PUBLIC_SURVEY_WITHDRAWAL_GLOBAL_WINDOW_SECONDS: "${PUBLIC_SURVEY_WITHDRAWAL_GLOBAL_WINDOW_SECONDS:-60}"
      GOOGLE_SURVEY_ATTEST_RATE_LIMIT: "${GOOGLE_SURVEY_ATTEST_RATE_LIMIT:-5}"
      GOOGLE_SURVEY_ATTEST_RATE_WINDOW_SECONDS: "${GOOGLE_SURVEY_ATTEST_RATE_WINDOW_SECONDS:-60}"
      LOGIN_RATE_LIMIT: "${LOGIN_RATE_LIMIT:-10}"
      LOGIN_RATE_WINDOW_SECONDS: "${LOGIN_RATE_WINDOW_SECONDS:-60}"
      LOGIN_GLOBAL_LIMIT: "${LOGIN_GLOBAL_LIMIT:-1000}"
      LOGIN_GLOBAL_WINDOW_SECONDS: "${LOGIN_GLOBAL_WINDOW_SECONDS:-60}"
      PASSWORD_RECOVERY_RATE_LIMIT: "${PASSWORD_RECOVERY_RATE_LIMIT:-5}"
      PASSWORD_RECOVERY_RATE_WINDOW_SECONDS: "${PASSWORD_RECOVERY_RATE_WINDOW_SECONDS:-900}"
      PASSWORD_RECOVERY_GLOBAL_LIMIT: "${PASSWORD_RECOVERY_GLOBAL_LIMIT:-1000}"
      PASSWORD_RECOVERY_GLOBAL_WINDOW_SECONDS: "${PASSWORD_RECOVERY_GLOBAL_WINDOW_SECONDS:-900}"
      MAX_REQUEST_BODY_BYTES: "${MAX_REQUEST_BODY_BYTES:-65536}"
      TRUSTED_PROXY_HEADER: "${TRUSTED_PROXY_HEADER:-X-Forwarded-For}"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-[]}"
      TRUSTED_PROXY_MAX_HOPS: "${TRUSTED_PROXY_MAX_HOPS:-20}"
      TRUSTED_PROXY_MAX_HEADER_BYTES: "${TRUSTED_PROXY_MAX_HEADER_BYTES:-2048}"
      SURVEY_DISTRIBUTION_DEFAULT_EXPIRY_DAYS: "${SURVEY_DISTRIBUTION_DEFAULT_EXPIRY_DAYS:-30}"
      SURVEY_DISTRIBUTION_MAX_EXPIRY_DAYS: "${SURVEY_DISTRIBUTION_MAX_EXPIRY_DAYS:-30}"
      PUBLIC_SURVEY_CONSENT_VERSION: "${PUBLIC_SURVEY_CONSENT_VERSION:-2026-09-01}"
      PUBLIC_SURVEY_PRIVACY_NOTICE: "${PUBLIC_SURVEY_PRIVACY_NOTICE:-Before Google sign-in and consent, this survey discloses: your verified Google email and display name are stored with your response; authorized researchers can identify respondents; identity enables one Google account per survey; on respondent withdrawal, direct identity and answers are removed but a survey-scoped pseudonymous dedupe digest is retained so that account cannot submit again; administrative erasure clears the digest; short-lived proof PII is physically deleted by the external purge after expiry. This survey does not promise anonymity or confidentiality.}"
      PUBLIC_SURVEY_PURPOSE: "${PUBLIC_SURVEY_PURPOSE:-Program evaluation and research.}"
      PUBLIC_SURVEY_RETENTION: "${PUBLIC_SURVEY_RETENTION:-Responses are retained according to the approved policy.}"
      PUBLIC_SURVEY_CONTACT: "${PUBLIC_SURVEY_CONTACT:-privacy@example.gov.ph}"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  adminer:
    image: adminer:4
    profiles:
      - tools
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: ${ADMINER_DEFAULT_SERVER}
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
