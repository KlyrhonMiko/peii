# Optional NVIDIA GPU runtime. Use together with docker-compose.yml.
# Requires a CUDA-compatible NVIDIA driver and NVIDIA Container Toolkit on the host.
services:
  backend:
    build:
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu130
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
